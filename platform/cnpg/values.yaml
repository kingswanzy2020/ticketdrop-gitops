# Values for the cloudnative-pg chart 0.29.1 (operator 1.30.1), installed in cnpg-system.
# Sizes the operator pod only; Postgres is sized in its Cluster's spec.resources.
# Chosen, not measured. No CPU limit, so the operator is never throttled; it is killed only past 256Mi.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
