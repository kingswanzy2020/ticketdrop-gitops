apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ticketdrop
  namespace: ticketdrop
spec:
  parentRefs:
    - name: ticketdrop
      namespace: traefik
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: gateway
          port: 8080
