apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: data
  labels:
    app: postgres
spec:
  instances: 1
  # Pinned so an operator upgrade does not change the Postgres version.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie

  # Creates catalog, owned by catalog, instead of the default app/app.
  bootstrap:
    initdb:
      database: catalog
      owner: catalog
      secret:
        name: pg-catalog

  postgresql:
    parameters:
      shared_buffers: "256MB"
    pg_hba:
      - hostssl sameuser all all scram-sha-256
      - host all all all reject

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      memory: "1Gi"
  # local-path cannot expand a volume, so this size is final.
  storage:
    size: 2Gi
    storageClass: standard
