apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.labels" . | nindent 8 }}
    spec:
      # Must exceed SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT, or the shutdown is cut off.
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      {{- with .Values.topologySpread }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "service.selectorLabels" $ | nindent 14 }}
          # Count only the new ReplicaSet's pods during a rolling update.
          matchLabelKeys:
            - pod-template-hash
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "service.name" . }}
          image: {{ include "service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- with .Values.ports.http }}
            - name: http
              containerPort: {{ . }}
            {{- end }}
            - name: admin
              containerPort: {{ .Values.ports.admin }}
          env:
            - name: SHUTDOWN_DELAY
              value: {{ .Values.shutdown.delay | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.databaseSecret }}
          envFrom:
            # Every key in the Secret (DATABASE_URL) becomes an env var.
            - secretRef:
                name: {{ . }}
          {{- end }}
          # The admin port opens only after the database wait and migrations,
          # so the startup probe holds the other two off until then.
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
