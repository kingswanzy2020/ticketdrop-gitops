# notifications: helm install notifications charts/service -n ticketdrop -f charts/service/values/values-notifications.yaml
# Settings mirror deploy/local/compose.yaml, with in-cluster host names.

# No app server: only the admin port (entry 38).
ports:
  http: null

# No database, so no databaseSecret.

env:
  # Publishes nothing: the queue and the way to reach it, not the topic.
  # Event bus: the goaws emulator in the data namespace.
  AWS_ENDPOINT_URL: http://goaws.data.svc.cluster.local:4100
  AWS_REGION: us-east-1
  # Placeholders: the emulator accepts anything, the SDK insists on something.
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  EVENTS_QUEUE_URL: http://goaws.data.svc.cluster.local:4100/000000000000/notifications-events
  CONSUMER_WAIT_TIME: 5s
  # Below the queue's 10s visibility timeout; the code defaults to 20s.
  CONSUMER_TIMEOUT: 5s
