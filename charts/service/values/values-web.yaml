# web: helm install web charts/service -n ticketdrop -f charts/service/values/values-web.yaml
# Settings mirror deploy/local/compose.yaml, with in-cluster host names.

env:
  # The shopfront uses the public API, through the gateway, like any client.
  API_URL: http://gateway:8080

replicaCount: 2

# Who may call it and what it calls (entry 50).
networkPolicy:
  callers: []
  externalCallers: [traefik]
  calls: [gateway]
