# fulfillment: helm install fulfillment charts/service -n ticketdrop -f charts/service/values/values-fulfillment.yaml
# Settings mirror deploy/local/compose.yaml, with in-cluster host names.

# No app server: only the admin port (entry 38).
ports:
  http: null

databaseSecret: fulfillment-db

env:
  # Event bus: the goaws emulator in the data namespace.
  AWS_ENDPOINT_URL: http://goaws.data.svc.cluster.local:4100
  AWS_REGION: us-east-1
  # Placeholders: the emulator accepts anything, the SDK insists on something.
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ticketdrop-events
  EVENTS_QUEUE_URL: http://goaws.data.svc.cluster.local:4100/000000000000/fulfillment-events
  CONSUMER_WAIT_TIME: 5s
  # Below the queue's 10s visibility timeout; the code defaults to 20s.
  CONSUMER_TIMEOUT: 5s
  # Slow and narrow on purpose: about 20 orders a second, so a burst of
  # orders leaves a backlog on the queue that can be watched draining.
  CONSUMER_CONCURRENCY: "4"
  SIMULATED_RENDER_TIME: 200ms
