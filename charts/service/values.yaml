# Defaults shared by every service. One release per service:
#   helm install orders charts/service -n ticketdrop -f values-orders.yaml
# A service's own values file overrides only what differs.

replicaCount: 1

# Rendered only when replicaCount > 1. A whole number, not a percentage:
# minAvailable or a rounded-up percentage on a small service blocks drains.
pdb:
  maxUnavailable: 1

# Keep replicas apart. Locally: hostname, as a preference (one node, no zone
# label). On EKS: topology.kubernetes.io/zone with DoNotSchedule. A zone key
# on a node without that label leaves DoNotSchedule pods Pending.
topologySpread:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

image:
  # Empty means ticketdrop/<release name>.
  repository: ""
  tag: dev
  pullPolicy: IfNotPresent

# Every service listens on ADMIN_ADDR (9090); web, gateway, catalog, orders
# and inventory also serve HTTP_ADDR (8080). A service with no app server sets
# `http: null`, which removes the port from the pod and the Service.
ports:
  http: 8080
  admin: 9090

# Plain settings, rendered as env. The service's values file adds its own.
env:
  LOG_LEVEL: info

# Name of the <service>-db Secret to load with envFrom. Empty: no database
# (gateway, web, notifications).
databaseSecret: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi

shutdown:
  # SHUTDOWN_DELAY: time for endpoints to drop the pod before draining.
  delay: 5s
  # Must exceed delay + SHUTDOWN_TIMEOUT (25s default).
  terminationGracePeriodSeconds: 40

# Who may call this service and what it calls, by name. Rendered as one
# NetworkPolicy; default-deny and DNS are in platform/network-policies/.
# The admin port (9090) is never opened: kubelet probes are always allowed.
networkPolicy:
  # Services in this namespace that may call this one's http port.
  callers: []
  # Pods in other namespaces that may call it, by key from `external`.
  externalCallers: []
  # Services in this namespace whose http port this one calls.
  calls: []
  # Destinations outside this namespace that it calls, by key from `external`.
  externalCalls: []
  # The http port of the services in `calls`; every service uses 8080.
  servicePort: 8080
  # Peers outside the namespace. A destination needs a port; a caller does not.
  # On EKS these change with the environment (Postgres and the event bus).
  external:
    traefik:
      namespace: traefik
      podLabels:
        app.kubernetes.io/name: traefik
    postgres:
      namespace: data
      # The cluster label, not role=primary, so a failover keeps the rule.
      podLabels:
        cnpg.io/cluster: pg
      port: 5432
    goaws:
      namespace: data
      podLabels:
        app: goaws
      port: 4100

probes:
  startup:
    # 2s x 40 = 80s, covering the 60s wait for Postgres plus migrations.
    periodSeconds: 2
    failureThreshold: 40

# true renders a ScaledObject and its TriggerAuthentication, and leaves
# replicas out of the Deployment, so the HPA that KEDA creates owns the count
# and an upgrade does not reset it. replicaCount is then not rendered, but
# pdb.yaml still reads it: keep it at 1 and the service gets no budget.
autoscaling:
  enabled: false
  # 0 when idle; KEDA starts the first pod when the queue has work.
  minReplicaCount: 0
  maxReplicaCount: 5
  # Seconds between reads of the queue. On AWS each read is a paid request.
  pollingInterval: 5
  # Seconds after the queue was last busy before 1 goes to 0.
  cooldownPeriod: 60
  # Seconds the HPA waits before scaling N down towards 1.
  scaleDownStabilizationSeconds: 30
  fallback:
    failureThreshold: 3
    replicas: 1
  sqs:
    # The queue the service consumes, as plain text: read from the
    # container's env, KEDA would also read its database Secret.
    queueURL: ""
    region: us-east-1
    # Empty on AWS; set only for the goaws emulator.
    endpoint: ""
    # Messages per pod, visible plus in flight, before another is added.
    queueLength: 5
    # Above this many messages a pod is started from 0.
    activationQueueLength: 0
  # How KEDA's operator signs its calls to the queue (entry 54). Not the
  # service's own credentials: on AWS the two are different roles.
  auth:
    # secret: a Secret <release>-keda-aws with the two keys below, for goaws,
    #   which accepts anything but the scaler insists on something.
    # aws: pod identity, an IAM role on EKS; no Secret is rendered.
    provider: secret
    # Placeholders only. A real credential never goes in values.
    accessKeyID: local
    secretAccessKey: local
